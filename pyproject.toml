[project]
name = "cuy-monitor-ai-service"
version = "0.1.0"
description = "Cuy Monitor vision and audio analysis service"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "pydantic-settings>=2.11",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv]
package = false

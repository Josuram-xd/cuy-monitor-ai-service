[project]
name = "cuy-monitor-ai-service"
version = "0.1.0"
description = "Cuy Monitor vision and audio analysis service"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "boto3>=1.43.110",
    "fastapi>=0.141,<0.142",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "onnxruntime>=1.26",
    "opencv-python-headless>=5.0.0.93",
    "pydantic-settings>=2.11",
    "python-multipart>=0.0.32",
    "scikit-learn>=1.9",
    "scipy>=1.18",
    "uvicorn>=0.35",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=7.0",
    "ruff>=0.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
# the service, the edge agent and the build script; training/ and dev/ run in Colab or by hand
source = ["app", "edge_agent", "scripts"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# Task 14.1: the pipeline modules are covered; a change that drops this fails `pytest --cov`
fail_under = 95

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv]
package = false
